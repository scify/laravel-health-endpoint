# Dependabot configuration for a PHP package (Composer + GitHub Actions).
# Based on templates/dependabot-laravel.yml in scify/.github, adapted for a package.
#
# Strategy:
#   - Security updates for every dependency, grouped into one PR per ecosystem.
#   - Version updates after a 7-day cooldown, in two grouped PRs: production dependencies (illuminate/*, spatie/*)
#     and development tools. The production group shows new major versions (for example Laravel 14), which the
#     package must follow. Cooldown applies to version updates only, never to security updates.
#     No `allow` filter: the docs do not say whether it also limits security updates.
#   - versioning-strategy: widen. composer.json is the package's compatibility promise to the apps that install it:
#     widen adds new versions to a range and never drops the old ones. increase (the app template) would narrow it.
#   - No npm block: the package has no package.json.
#
# Security updates also require "Dependabot security updates" to be enabled in the repository's Security settings.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    versioning-strategy: widen
    labels:
      - dependencies
      - php
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      composer-production:
        applies-to: version-updates
        dependency-type: production
      composer-development:
        applies-to: version-updates
        dependency-type: development
      composer-security:
        applies-to: security-updates
        patterns:
          - '*'

  # Reads `uses:` lines in .github/workflows/*.yml. For this ecosystem `/` means .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
